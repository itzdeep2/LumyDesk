<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumyDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
<div class="logo">
<h1>LumyDesk 🌸</h1>
</div>
<nav class="nav-links">
<button class="nav-btn active" data-tab="timer">⏱️ Timer</button>
<button class="nav-btn" data-tab="todo">✅ To-Do</button>
<button class="nav-btn" data-tab="planner">🗓️ Planner</button>
<button class="nav-btn" data-tab="notes">📝 Notes</button>
<button class="nav-btn" data-tab="calendar">📅 Calendar</button>
<button class="nav-btn" data-tab="progress">📊 Progress</button>
</nav>
<div class="sidebar-footer">
<select id="theme-picker">
<option value="peach">Peach</option>
<option value="mint">Mint</option>
<option value="lavender">Lavender</option>
<option value="sky">Sky</option>
<option value="night">Night</option>
</select>
</div>
</aside>
  
  <main>
    <section class="tab-pane active" id="timer">
      <h2>Timer</h2>
      <div id="time-display">25:00</div>
      <div class="controls">
        <button id="start-btn">Start</button>
        <button id="reset-btn">Reset</button>
      </div>
      <p>Sessions completed: <span id="session-count">0</span></p>
    </section>

    <section class="tab-pane" id="todo">>
      <h2>To-Do</h2>
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="what needs to be done?">
        <button id="add-todo">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <section class="tab-pane" id="notes">>
      <h2>Notes</h2>
      <textarea id="notes-area" placeholder="dump your thoughts here..."></textarea>
    </section>

    <section class="tab-pane" id="planner">
      <h2>Study Planner</h2>
      <div class="planner-form">
        <input type="text" id="subject-name" placeholder="Subject (e.g. Physics)">
        <input type="text" id="chapter-name" placeholder="Chapter name">
        <button id="add-chapter-btn">Add</button>
      </div>
      <div id="planner-tray"></div>
      <div id="week-grid">
        <div class="day-col" data-day="Mon"><h3>Mon</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Tue"><h3>Tue</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Wed"><h3>Wed</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Thu"><h3>Thu</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Fri"><h3>Fri</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Sat"><h3>Sat</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Sun"><h3>Sun</h3><div class="day-drop"></div></div>
      </div>
    </section>
    <section class="tab-pane" id="calendar">
      <h2>Calendar</h2>
      <div id="calendar-view"></div>
    </section>

    <section class="tab-pane" id="progress">
      <h2>Overview</h2>
      <div class="progress-grid">
        <div class="card stat-card">
          <span class="stat-value" id="total-focus-time">0h</span>
          <span class="stat-label">Focus Time</span>
        </div>
        <div class="card stat-card">
          <span class="stat-value" id="total-tasks-done">0</span>
          <span class="stat-label">Tasks Completed</span>
        </div>
        <div class="card stat-card">
          <span class="stat-value" id="total-chapters-done">0</span>
          <span class="stat-label">Chapters Scheduled</span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
