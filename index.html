<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumyDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h1>LumyDesk</h1>
    <select id="theme-picker">
      <option value="peach">Peach</option>
      <option value="mint">Mint</option>
      <option value="lavender">Lavender</option>
      <option value="sky">Sky</option>
      <option value="night">Night</option>
    </select>
  </nav>
  
  <main>
    <section class="card" id="timer-section">
      <h2>Timer</h2>
      <div id="time-display">25:00</div>
      <div class="controls">
        <button id="start-btn">Start</button>
        <button id="reset-btn">Reset</button>
      </div>
      <p>Sessions completed: <span id="session-count">0</span></p>
    </section>

    <section class="card" id="todo-section">
      <h2>To-Do</h2>
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="what needs to be done?">
        <button id="add-todo">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <section class="card" id="notes-section">
      <h2>Notes</h2>
      <textarea id="notes-area" placeholder="dump your thoughts here..."></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
