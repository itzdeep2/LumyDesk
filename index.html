<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumyDesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h1>LumyDesk</h1>
    <select id="theme-picker">
      <option value="peach">Peach</option>
      <option value="mint">Mint</option>
      <option value="lavender">Lavender</option>
      <option value="sky">Sky</option>
      <option value="night">Night</option>
    </select>
  </nav>
  
  <main>
    <section class="card" id="timer-section">
      <h2>Timer</h2>
      <div id="time-display">25:00</div>
      <div class="controls">
        <button id="start-btn">Start</button>
        <button id="reset-btn">Reset</button>
      </div>
      <p>Sessions completed: <span id="session-count">0</span></p>
    </section>

    <section class="card" id="todo-section">
      <h2>To-Do</h2>
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="what needs to be done?">
        <button id="add-todo">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <section class="card" id="planner-section">
      <h2>Study Planner</h2>
      <div class="planner-form">
        <input type="text" id="subject-name" placeholder="Subject (e.g. Physics)">
        <input type="text" id="chapter-name" placeholder="Chapter name">
        <button id="add-chapter-btn">Add</button>
      </div>
      <div id="planner-tray"></div>
      <div id="week-grid">
        <div class="day-col" data-day="Mon"><h3>Mon</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Tue"><h3>Tue</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Wed"><h3>Wed</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Thu"><h3>Thu</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Fri"><h3>Fri</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Sat"><h3>Sat</h3><div class="day-drop"></div></div>
        <div class="day-col" data-day="Sun"><h3>Sun</h3><div class="day-drop"></div></div>
      </div>
    </section>>
  </main>

  <script src="script.js"></script>
</body>
</html>
