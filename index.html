<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LumyDesk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- left menu -->
<aside class="sidebar">
<h1 class="logo">Lumy<span>Desk</span></h1>
<nav>
<button class="nav-btn active" data-page="timer">Timer</button>
<button class="nav-btn" data-page="todo">To-do</button>
<button class="nav-btn" data-page="notes">Notes</button>
<button class="nav-btn" data-page="planner">Planner</button>
<button class="nav-btn" data-page="calendar">Calendar</button>
<button class="nav-btn" data-page="progress">Progress</button>
</nav>
</aside>

<!-- main area, only one page shows at a time -->
<main class="content">
<section class="page active" id="timer">
<h2>Pomodoro Timer</h2>
      <div class="timer-box">
        <div class="mode-buttons">
<button class="mode-btn active" data-mode="focus">Focus</button>
<button class="mode-btn" data-mode="short">Short break</button>
<button class="mode-btn" data-mode="long">Long break</button>
</div>
<div id="timerDisplay">25:00</div>
<div class="timer-buttons">
<button class="btn" id="startBtn">Start</button>
<button class="btn" id="pauseBtn">Pause</button>
<button class="btn" id="resetBtn">Reset</button>
</div>
</div>
</section>
<section class="page" id="todo">
<h2>To-do List</h2>
      <div class="add-row">
<input type="text" id="todoInput" placeholder="What do you need to do?">
<button class="btn" id="todoAddBtn">Add</button>
</div>
<ul id="todoList"></ul>
</section>
<section class="page" id="notes">
<h2>Notes</h2>
<div class="notes-layout">
<div class="notes-side">
<button class="btn" id="newNoteBtn">+ New note</button>
<ul id="noteList"></ul>
</div>
<div class="notes-editor">
<input type="text" id="noteTitle" placeholder="Note title">
<textarea id="noteBody" placeholder="Write your notes here..."></textarea>
<button class="btn" id="deleteNoteBtn">Delete note</button>
</div>
</div>
</section>
<section class="page" id="planner">
<h2>Study Planner</h2>
<div class="planner-layout">
<!-- left side: subjects and their chapters -->
<div class="subject-panel">
<div class="add-row">
<input type="text" id="subjectInput" placeholder="Add subject (eg. Physics)">
<button class="btn" id="subjectAddBtn">+</button>
</div>
<p class="hint">Drag a chapter to a day. Double click a chapter to delete it.</p>
<div id="subjectList"></div>
</div>
</div>
</section>
<section class="page" id="calendar">
<h2>Calendar</h2>
<p>Calendar coming soon...</p>
</section>
<section class="page" id="progress">
<h2>Progress</h2>
<p>Progress coming soon...</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
